name: Kernel Builder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  KERNEL_DIR: ${{ github.workspace }}
  OUTPUT_BASE: ${{ github.workspace }}/builds
  TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain
  CONFIG: msm8937go_defconfig
  TOOLCHAIN_URL: https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-eabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-eabi.tar.xz
  TOOLCHAIN: gcc-linaro-7.5.0-2019.12-x86_64_arm-eabi

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl1.1 \
          libssl-dev=1.1.1* \
          libncurses-dev \
          wget \
          tar \
          xz-utils \
          python2.7 \
          git-core \
          gnupg \
          libelf-dev

    - name: Create output directory
      run: |
        BUILD_DATE=$(date +%Y%m%d_%H%M%S)
        OUTPUT_DIR="$OUTPUT_BASE/build_$BUILD_DATE"
        echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
        mkdir -p "$OUTPUT_DIR"
        echo "Build artifacts will be saved to: $OUTPUT_DIR"

    - name: Install toolchain
      run: |
        mkdir -p "$TOOLCHAIN_DIR"
        cd "$TOOLCHAIN_DIR"
        wget -q "$TOOLCHAIN_URL" -O linaro.tar.xz
        tar xf linaro.tar.xz
        rm linaro.tar.xz
        echo "$TOOLCHAIN_DIR/$TOOLCHAIN/bin" >> $GITHUB_PATH

    - name: Verify toolchain
      run: |
        arm-eabi-gcc --version
        arm-eabi-ld --version

    - name: Fix diag_pcie build issue
      run: |
        # Check if diag_pcie exists and create dummy if missing
        if [ ! -f "$KERNEL_DIR/drivers/char/diag/diag_pcie.c" ]; then
          echo "Creating dummy diag_pcie implementation..."
          echo "// Dummy diag_pcie implementation" > "$KERNEL_DIR/drivers/char/diag/diag_pcie.c"
          echo "obj-y += diag_pcie.o" >> "$KERNEL_DIR/drivers/char/diag/Makefile"
        fi

    - name: Generate Makefile includes
      run: |
        # Find all relevant directories and create include paths
        find "$KERNEL_DIR/drivers" "$KERNEL_DIR/arch/arm" "$KERNEL_DIR/include" \
          -type d -print | while read -r dir; do
          makefile="$dir/Makefile"
          if [ -f "$makefile" ]; then
            rel_path="${dir#$KERNEL_DIR/}"
            if ! grep -q "ccflags-y.*-I\$(srctree)/$rel_path" "$makefile"; then
              echo "ccflags-y += -I\$(srctree)/$rel_path" >> "$makefile"
              echo "Added include path to $makefile"
            fi
          fi
        done

        # Apply special cases
        echo "ccflags-y += -I\$(srctree)/drivers/usb/gadget -I\$(srctree)/drivers/usb/gadget/function" \
          >> "$KERNEL_DIR/drivers/usb/gadget/Makefile"
        echo "ccflags-y += -I\$(src)" >> "$KERNEL_DIR/drivers/soc/qcom/Makefile"

    - name: Build kernel
      run: |
        export CROSS_COMPILE="arm-eabi-"
        export ARCH=arm
        export KCFLAGS="-Wno-deprecated-declarations"  # Suppress OpenSSL warnings
        
        cd "$KERNEL_DIR"
        make clean && make mrproper
        
        # First pass to generate config dependencies
        make "$CONFIG" O="$OUTPUT_DIR"
        
        # Verify DIAG_PCIE config
        if grep -q "CONFIG_DIAG_PCIE=y" "$OUTPUT_DIR/.config"; then
          echo "Disabling DIAG_PCIE in config"
          sed -i 's/CONFIG_DIAG_PCIE=y/CONFIG_DIAG_PCIE=n/' "$OUTPUT_DIR/.config"
        fi
        
        # Second pass with full build
        if ! make -j$(nproc) O="$OUTPUT_DIR" 2> "$OUTPUT_DIR/errors.log"; then
          echo "::error::Build failed!"
          echo "=== Last 20 errors ==="
          grep -i 'error:' "$OUTPUT_DIR/errors.log" | tail -n 20
          echo "=== Critical errors ==="
          grep -i 'stop' "$OUTPUT_DIR/errors.log" | sort | uniq -c
          exit 1
        fi
        
        # Verify output
        if [ ! -f "$OUTPUT_DIR/arch/arm/boot/zImage" ]; then
          echo "::error::zImage not found!"
          ls -la "$OUTPUT_DIR/arch/arm/boot/"
          exit 1
        fi

    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ env.BUILD_DATE }}
        path: |
          ${{ env.OUTPUT_DIR }}/arch/arm/boot/zImage
          ${{ env.OUTPUT_DIR }}/.config
          ${{ env.OUTPUT_DIR }}/*.log
        retention-days: 7

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ env.BUILD_DATE }}
        path: |
          ${{ env.OUTPUT_DIR }}/*.log
        retention-days: 30

    - name: Analyze build failures
      if: failure()
      run: |
        echo "=== Build failure analysis ==="
        echo "Most common errors:"
        grep -i 'error:' "$OUTPUT_DIR/errors.log" | sort | uniq -c | sort -nr | head -n 10
        echo ""
        echo "Missing file suggestions:"
        grep -i 'No such file' "$OUTPUT_DIR/errors.log" | sort | uniq
        echo ""
        echo "Makefile issues:"
        grep -i 'No rule to make target' "$OUTPUT_DIR/errors.log" | sort | uniq
