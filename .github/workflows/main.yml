name: Build Kernel MSM8937 (zImage only)

on:
  push:
    branches:
      - testing

jobs:
  build-kernel:
    name: Build zImage for Cat S22 Flip (MSM8937)
    runs-on: ubuntu-latest

    env:
      ARCH: arm
      SUBARCH: arm
      DEFCONFIG: msm8937_defconfig
      CLANG_TRIPLE: arm-linux-gnueabi-
      CROSS_COMPILE: arm-linux-gnueabi-

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make libc6-dev \
            libncurses5-dev libelf-dev ccache build-essential \
            clang lld llvm gcc-arm-linux-gnueabi

      - name: Setup output directory
        run: mkdir -p out

      - name: Configure Kernel
        run: |
          make O=out $DEFCONFIG

      - name: Build Kernel (zImage only)
        run: |
          make -j$(nproc) O=out \
            ARCH=$ARCH \
            CC=clang \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            LD=ld.lld zImage

      - name: Rename zImage
        run: |
          mkdir -p release
          cp out/arch/arm/boot/zImage release/zImage

      - name: Upload zImage to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.sha }}
          name: Kernel zImage Build - ${{ github.sha }}
          files: release/zImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
